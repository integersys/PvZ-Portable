name: Website build

on:
  workflow_dispatch:
  push:
    branches:
      - web-test

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-wasm:
    name: Build website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build WebAssembly
        run: bash wasm/build-wasm.sh --deps

      - name: Create GitHub Pages homepage
        run: cp build-wasm/pvz-portable.html build-wasm/index.html

      - name: Upload downloadable WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sewer-cyn-wasm
          path: |
            build-wasm/pvz-portable.html
            build-wasm/pvz-portable.js
            build-wasm/pvz-portable.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-wasm

  deploy:
    name: Deploy website
    needs: build-wasm
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4